<div class="row">
  <div class="col-md-12">
    <img [src]="recipe?.imagePath" alt="{{ recipe?.name }}" class="img-fluid" />
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <h1>{{ recipe?.name }}</h1>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <div class="btn-group">
      <button data-bs-toggle="dropdown" class="btn btn-primary dropdown-toggle">
        Manage Recipe
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#">To Shopping List</a></li>
        <li><a class="dropdown-item" href="#">Edit Recipe</a></li>
        <li><a class="dropdown-item" href="#">Delete Recipe</a></li>
      </ul>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <h3>{{ recipe?.description }}</h3>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <h3>Ingredients</h3>
  </div>
</div>
