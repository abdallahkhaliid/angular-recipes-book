<div class="recipe-details-card" *ngIf="recipe; else noRecipe">
  <div class="hero">
    <img [src]="recipe.imagePath" [alt]="recipe.name" class="hero-img" />
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">{{ recipe.name }}</h1>
      <p class="hero-desc">{{ recipe.description }}</p>
    </div>
    <div class="hero-actions">
      <div class="btn-group">
        <button data-bs-toggle="dropdown" class="btn-manage dropdown-toggle">
          Manage Recipe
        </button>
        <ul class="dropdown-menu">
          <li>
            <button type="button" class="dropdown-item" (click)="onAddToShoppingList()">
              To Shopping List
            </button>
          </li>
          <li>
            <button type="button" class="dropdown-item" (click)="onEditRecipe()">Edit Recipe</button>
          </li>
          <li>
            <button type="button" class="dropdown-item text-danger" (click)="onDeleteRecipe()">Delete Recipe</button>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="details-body">
    <div class="section">
      <h4 class="section-title">Description</h4>
      <p class="section-text">{{ recipe.description }}</p>
    </div>

    <div class="section">
      <h4 class="section-title">
        Ingredients
        <span class="ing-count">{{ recipe.ingredients?.length || 0 }}</span>
      </h4>
      <ul class="ingredients-list" *ngIf="recipe.ingredients?.length; else noIngredients">
        <li class="ingredient-item" *ngFor="let ingredient of recipe.ingredients">
          <span class="item-name">{{ ingredient.name }}</span>
          <span class="item-amount">{{ ingredient.amount }}</span>
        </li>
      </ul>
      <ng-template #noIngredients>
        <p class="muted">No ingredients added.</p>
      </ng-template>
    </div>
  </div>
</div>

<ng-template #noRecipe>
  <div class="empty-state">
    <div class="empty-icon">📖</div>
    <p class="empty-title">Recipe not found</p>
    <p class="empty-text">It may have been deleted.</p>
  </div>
</ng-template>
