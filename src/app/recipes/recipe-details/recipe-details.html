<div class="row">
  <div class="col-md-12">
    <img [src]="recipe?.imagePath" alt="{{ recipe?.name }}" class="img-fluid" />
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <h1>{{ recipe?.name }}</h1>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <div class="btn-group">
      <button data-bs-toggle="dropdown" class="btn btn-primary dropdown-toggle">
        Manage Recipe
      </button>
      <ul class="dropdown-menu">
        <li>
          <a class="dropdown-item" href="#" (click)="onAddToShoppingList()">To Shopping List</a>
        </li>
        <li><a class="dropdown-item" href="#">Edit Recipe</a></li>
        <li><a class="dropdown-item" href="#">Delete Recipe</a></li>
      </ul>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <h3>{{ recipe?.description }}</h3>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let ingredient of recipe?.ingredients">
        {{ ingredient.name }} - {{ ingredient.amount }}
      </li>
    </ul>
  </div>
</div>
