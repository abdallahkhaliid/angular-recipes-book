<div class="row">
  <div class="col-md-12">
    <button class="btn btn-success">New Recipe</button>
  </div>
</div>

<div class="row">
  <br />
  <div
    class="col-lg-4 col-md-8 mb-4"
    (click)="onRecipeSelected(recipe)"
    *ngFor="let recipe of recipes"
  >
    <app-recipe-item [recipe]="recipe"></app-recipe-item>
  </div>
</div>
