<div class="row">
  <div class="col-md-12">
    <button class="btn btn-success" (click)="onNewRecipe()">New Recipe</button>
  </div>
</div>

<div class="row">
  <br />
  <div class="col-lg-4 col-md-8 mb-4" *ngFor="let recipe of recipes; let i = index">
    <app-recipe-item [recipe]="recipe" [index]="i"></app-recipe-item>
  </div>
</div>
