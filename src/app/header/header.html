<nav class="navbar navbar-expand-lg navbar-light bg-white premium-navbar mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="#">
      <i class="bi bi-journal-richtext me-2"></i>Recipe Book
    </a>

    <button
      class="navbar-toggler border-0 shadow-none"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarContent"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active px-3" routerLinkActive="active" routerLink="/recipes"
            >Recipes</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" routerLinkActive="active" routerLink="/shopping-list"
            >Shopping List</a
          >
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">
        @if (user()) {
          <span class="text-muted small me-1 d-none d-lg-inline">{{ user()?.email }}</span>
          <button class="btn btn-outline-danger premium-btn" type="button" (click)="onLogout()">
            <i class="bi bi-box-arrow-right me-2"></i>Logout
          </button>
        } @else {
          <a class="btn btn-outline-primary premium-btn" routerLink="/auth" routerLinkActive="active">
            <i class="bi bi-person-circle me-2"></i>Login
          </a>
        }

        <div class="dropdown" [class.show]="isDropdownOpen()">
          <button
            class="btn btn-outline-primary dropdown-toggle premium-btn"
            type="button"
            id="manageDropdown"
            (click)="onToggleDropdown()"
            [attr.aria-expanded]="isDropdownOpen()"
          >
            Manage
          </button>
          <ul
            class="dropdown-menu dropdown-menu-end border-0 shadow-sm transition-fade"
            [class.show]="isDropdownOpen()"
            aria-labelledby="manageDropdown"
          >
            <li>
              <a class="dropdown-item" (click)="onSaveData()"
                ><i class="bi bi-cloud-arrow-up me-2"></i>Save Data</a
              >
            </li>
            <li>
              <a class="dropdown-item" (click)="onFetchData()"
                ><i class="bi bi-cloud-arrow-down me-2"></i>Fetch Data</a
              >
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
