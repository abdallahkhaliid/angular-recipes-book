<div class="row">
  <div class="col-md-12">
    <form>
      <div class="row">
        <div class="col-sm-5 form-group">
          <label for="name">Name</label>
          <input type="text" #name id="name" class="form-control" />
        </div>
        <div class="col-sm-5 form-group">
          <label for="amount">Amount</label>
          <input type="number" #amount id="amount" class="form-control" />
        </div>

        <div class="col-sm-2">
          <button
            class="btn btn-success"
            type="button"
            (click)="onAddItem(name.value, +amount.value)"
          >
            Add
          </button>
          <button
            class="btn btn-danger"
            type="button"
            (click)="onDeleteItem(name.value, +amount.value)"
          >
            Delete
          </button>
          <button class="btn btn-primary" type="button" (click)="onClearItems()">Clear</button>
        </div>
      </div>
    </form>
  </div>
</div>
