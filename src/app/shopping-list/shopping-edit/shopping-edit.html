<div class="shopping-edit-card">
  <div class="card-header-row">
    <h5 class="card-title">Add Ingredient</h5>
    <span class="card-subtitle">Add items to your shopping list</span>
  </div>
  <form (ngSubmit)="onAddItem(f)" #f="ngForm">
    <div class="row g-3 align-items-end">
      <div class="col-sm-5 form-group">
        <label for="name">Name</label>
        <input
          type="text"
          name="name"
          ngModel
          id="name"
          class="form-control"
          placeholder="e.g. Tomatoes"
          required
        />
      </div>
      <div class="col-sm-3 form-group">
        <label for="amount">Amount</label>
        <input
          type="number"
          name="amount"
          ngModel
          id="amount"
          class="form-control"
          placeholder="e.g. 2"
          required
          min="1"
        />
      </div>

      <div class="col-sm-4 actions">
        <button class="btn btn-add" type="submit" [disabled]="!f.valid">
          {{ editMode ? 'Update' : 'Add' }}
        </button>
        <button class="btn btn-delete" type="button" (click)="onDeleteItem()" [disabled]="!editMode">Delete</button>
        <button class="btn btn-clear" type="button" (click)="onClearItems()">Clear</button>
      </div>
    </div>
  </form>
</div>
