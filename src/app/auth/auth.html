<!-- <ng-template #dynamicComponent></ng-template> -->
<ng-template #dynamicComponent></ng-template>

<div class="row">
  <div class="col-xs-12 col-md-6 offset-3">
    <form #form="ngForm" (ngSubmit)="onSubmit(form)">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          class="form-control"
          id="email"
          required
          email
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          class="form-control"
          id="password"
          required
          minlength="6"
        />
      </div>

      <!-- <app-alert [message]="errorMessage()" (close)="onHandleError()" /> -->

      <div class="d-flex justify-content-between align-items-center mt-3">
        <button
          type="submit"
          class="btn btn-primary d-flex align-items-center gap-2"
          [disabled]="form.invalid || isLoading()"
        >
          @if (isLoading()) {
            <app-spinner [small]="true" />
            <span>{{ isLoggedInMode ? 'Logging in...' : 'Signing up...' }}</span>
          } @else {
            <span>{{ isLoggedInMode ? 'Login' : 'Sign Up' }}</span>
          }
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          [disabled]="isLoading()"
          (click)="onSwitchMode()"
        >
          {{ isLoggedInMode ? 'Switch to Sign Up' : 'Switch to Login' }}
        </button>
      </div>
    </form>
  </div>
</div>
